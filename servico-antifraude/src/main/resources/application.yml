server:
  port: 8082

spring:
  application:
    name: servico-antifraude
  # Banco próprio deste serviço: só ele lê e escreve aqui.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/antifraude
    username: ${DB_USER:antifraude}
    password: ${DB_PASSWORD:antifraude}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  # Cache do resultado da análise: o que guarda, por quanto tempo e quando apaga (ver ADR 0006).
  cache:
    type: redis
    cache-names: analises
    redis:
      time-to-live: 10m
      cache-null-values: false
      key-prefix: "antifraude:"

fila:
  transacoes: antifraude.transacoes

antifraude:
  valor-maximo: "5000.00"
  janela-minutos: 5
  max-transacoes-na-janela: 3
